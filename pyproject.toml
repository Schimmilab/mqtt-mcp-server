[project]
name = "mqtt-mcp-server"
version = "0.2.0"
description = "MCP server for MQTT with a searchable message history, silence detection and connection-gap tracking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Obergrenzen bewusst gesetzt: ohne sie loeste eine Frischinstallation am
    # 2026-07-30 sechs Server dieser Flotte auf inkompatible Major-Versionen auf.
    "fastmcp>=2.12,<4",
    "paho-mqtt>=2.1,<3",
]

[project.scripts]
mqtt-mcp-server = "mqtt_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mqtt_mcp_server"]
